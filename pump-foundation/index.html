<title>Pump Foundation Sequence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&family=Geist+Mono:wght@400&display=swap">
<style>
/* Layout: one 5:4 plate holding the whole beam, sized to fit the viewport, with a rail of the twelve
   stages under it. Black and white only: white on black in dark, black on white in light. */
:root{
  color-scheme:light;
  --ground:#ffffff; --ink:#000000; --muted:#6c6c6c; --line:#e4e4e4;
  --hairline-plate:#ffffff; --hairline-hi:#000000; --hairline-edge:#6a6a6a; --hairline-mid:#adadad; --hairline-lo:#dedede; --hairline-stroke:0.9;
  --f-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#000000; --ink:#ffffff; --muted:#8c8c8c; --line:#1e1e1e;
    --hairline-plate:#000000; --hairline-hi:#ffffff; --hairline-edge:#8e8e8e; --hairline-mid:#4c4c4c; --hairline-lo:#262626;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#000000; --ink:#ffffff; --muted:#8c8c8c; --line:#1e1e1e;
  --hairline-plate:#000000; --hairline-hi:#ffffff; --hairline-edge:#8e8e8e; --hairline-mid:#4c4c4c; --hairline-lo:#262626;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:13px/1.5 var(--f-sans);-webkit-font-smoothing:antialiased}
.wrap{--w:min(100%, max(320px, calc((100svh - 230px)*1.25)), 980px);max-width:1100px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:36px 56px;display:grid;gap:22px;justify-items:center}
.wrap > *{min-width:0;width:var(--w)}
header{display:grid;gap:8px}
h1{margin:0;font:300 clamp(28px,3.6vw,42px)/1.05 var(--f-sans);letter-spacing:-.025em;text-wrap:balance}
header p{margin:0;max-width:60ch;color:var(--muted);font-size:14px;text-wrap:pretty}
.plate{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--ground)}
.tag{position:absolute;top:14px;z-index:1;font:11px/1 var(--f-mono);letter-spacing:.02em;color:var(--muted);pointer-events:none}
#stageName{left:16px}
#read{right:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.rail{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));gap:14px 8px}
@media (max-width:560px){.rail{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rail button{width:100%;display:grid;gap:7px;padding:0;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left;font:11px/1.2 var(--f-mono);letter-spacing:.01em}
.rail button::before{content:"";display:block;height:1px;background:var(--line);transition:background-color .3s}
.rail button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail button:hover{color:var(--ink)}
.rail button.done::before{background:var(--muted)}
.rail button[aria-current="step"]{color:var(--ink)}
.rail button[aria-current="step"]::before{background:var(--ink)}
.rail button:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
footer{font:11px/1.7 var(--f-mono);color:var(--muted)}
footer a{color:inherit}
@media (prefers-reduced-motion: reduce){.rail button::before{transition:none}}
</style>
<div class="wrap">
  <header>
    <h1>Pump foundation, built in lines</h1>
    <p>A pump pedestal foundation model, from its outline to its first two vibration modes, in a single loop. Move across the drawing to scrub it, or pick a stage below.</p>
  </header>
  <div class="plate">
    <span class="tag" id="stageName"></span>
    <span class="tag" id="read"></span>
    <div id="stage" data-hairline="pump-foundation" role="img" aria-label="A pump pedestal foundation is drawn in lines: outlines, keypoints, edges, the footing area, the footing, anchor bolts and the pedestal poured around them, grout, a steel baseplate and nuts, materials, a mesh, piles, the pump and motor, and two vibration modes."></div>
  </div>
  <ol class="rail" id="rail" aria-label="Stages" style="--cols:6"></ol>
  <footer>Drawn on the <a href="https://github.com/lucasmarkes/hairline">hairline</a> kernel by Lucas Marques, MIT licence.</footer>

    M.piles.forEach(p => { const v = val(p.s), on = v > .001; show(p.el.g, on); if (on) putc(p.el, prism(Pw, front, p.ring, p.inner, ZT*v, 0)); cls(p.el.sil, k === 16 ? 'sil hi' : 'sil'); });

    const va = val(M.areaS), vf = val(M.footS);
    show(M.area, va > .001 && vf < .02);
    if (va > .001) setD(M.area, poly(fillet([P(0, 0, 0), P(FX, 0, 0), P(FX, FY*va, 0), P(0, FY*va, 0)], [2, 2, 2, 2])));
    cls(M.area, k === 6 ? 'hi' : 'sil');
    show(M.foot.g, vf > .001);
    if (vf > .001) putc(M.foot, prism(Pw, front, M.footR[0], M.footR[1], 0, Math.max(.6, FZ*vf)));
    cls(M.foot.sil, k === 7 ? 'sil hi' : 'sil');
    M.fmesh.forEach(l => setD(l.el, line(l.w.map(p => Pw(...p)), val(l.s))));
    M.agg.forEach(d => show(d.el, val(d.s) > .5));
    M.outline.forEach(o => { setD(o.el, line(o.w.map(p => P(...p)), val(o.s))); cls(o.el, k === o.ph ? 'nf dash hi' : 'nf dash'); });

    M.bolts.forEach(b => {
      b.v = val(b.s); const dz = 30*(1 - b.v);
      setD(b.low, b.v > .001 ? open([Pw(b.x + 3, b.y, 18 + dz), Pw(b.x, b.y, 18 + dz), Pw(b.x, b.y, PZ + dz)]) : '');
      cls(b.low, k === 8 ? 'nf hi' : 'nf sil');
    });
    const vp = val(M.pedS), ztop = vp > .001 ? FZ + (PZ - FZ)*vp : 18;
    show(M.ped.g, vp > .001);
    if (vp > .001) putc(M.ped, prism(Pw, front, M.pedR[0], M.pedR[1], FZ, ztop));
    cls(M.ped.sil, k === 9 ? 'sil hi' : 'sil');
    M.pmesh.forEach(l => setD(l.el, line(l.w.map(p => Pw(...p)), val(l.s))));
    M.bolts.forEach(b => {
      const dz = 30*(1 - b.v);
      setD(b.up, b.v > .001 ? line([Pw(b.x, b.y, Math.max(ztop, 18 + dz)), Pw(b.x, b.y, 53.5 + dz)]) : '');
      cls(b.up, k === 8 ? 'nf hi' : 'nf sil');
    });

    const vg = val(M.groutS), vpl = val(M.plateS);
    show(M.grout.g, vg > .001);
    if (vg > .001){ const dz = 16*(1 - vg); putc(M.grout, prism(Pw, front, M.groutR[0], M.groutR[1], PZ + dz, PZ + 2 + dz)); }
    cls(M.grout.sil, k === 10 ? 'sil hi' : 'sil');
    show(M.plate.g, vpl > .001);
    if (vpl > .001){ const dz = 20*(1 - vpl); putc(M.plate, prism(Pw, front, M.plateR[0], M.plateR[1], PZ + 2 + dz, ZB + dz)); }
    cls(M.plate.sil, k === 11 ? 'sil hi' : 'sil');
    M.bolts.forEach(b => {
      const v = val(b.ns), on = v > .001; show(b.nut.g, on);
      if (on){ const dz = 12*(1 - v); putc(b.nut, prism(Pw, front, b.ring, b.inner, ZB + dz, ZB + 2.5 + dz)); }
      cls(b.nut.sil, k === 12 ? 'sil hi' : 'sil');
      const z0 = v > .99 ? ZB + 2.5 : vpl > .99 ? ZB : vg > .99 ? PZ + 2 : null;
      setD(b.tip, b.v > .99 && z0 !== null ? line([Pw(b.x, b.y, z0), Pw(b.x, b.y, 53.5)]) : '');
      cls(b.tip, k === 12 ? 'nf hi' : 'nf sil');
    });

    M.mach.forEach((m, i) => {
      const v = val(m.s), on = v > .001; show(m.el.g, on);
      if (on){
        const dz = 22*(1 - v);
        if (m.kind === 'cyl') putc(m.el, cyl(Pw, m.x0, m.x1, m.y, m.z + dz, m.R));
        else putc(m.el, prism(Pw, front, m.ring, m.inner, m.z0 + dz, m.z1 + dz));
        if (m.fin) setD(m.fin, m.fins.map(a => { const y = m.y + m.R*Math.cos(a), z = m.z + dz + m.R*Math.sin(a); return line([Pw(m.x0 + 2, y, z), Pw(m.x1 - 2, y, z)]); }).join(''));
      }
      cls(m.el.sil, k === PH[i] ? 'sil hi' : 'sil');
    });
    const th = reducedMotion() ? .8 : S.now/1000*2*Math.PI*1.1;
    M.orbits.forEach(o => {
      const v = val(o.s), R = o.R*v;
      setD(o.el, v > .001 ? poly(Array.from({ length: 18 }, (_, i) => { const a = i/18*2*Math.PI; return Pw(o.x, 40 + R*Math.cos(a), AX + R*Math.sin(a)); })) : '');
      show(o.dot, v > .5);
      if (v > .5) place(o.dot, Pw(o.x, 40 + R*Math.cos(th + o.ph), AX + R*Math.sin(th + o.ph)));
    });

    M.wire.forEach((w, i) => { const v = val(w.s); setD(w.el, line([P(...w.a), P(...mix(w.a, w.b, v))])); cls(w.el, w.hid ? 'nf dash' : k === 5 ? 'nf hi' : 'nf sil'); });
    let newest = -1;
    M.kps.forEach((q, n) => {
      const v = val(q.s), [x, y, z0] = q.p, z = z0 + 20*(1 - v);
      show(q.el, v > .001); place(q.el, P(x, y, z));
      setD(q.drop, v > .001 && v < .999 ? line([P(x, y, ZT), P(x, y, z)]) : '');
      if (k === q.ph) newest = n;
    });
    M.kps.forEach((q, n) => cls(q.el, n === newest ? 'dot' : 'dot m'));
  };
})();

/* Playback: the loop's clock, scrubbing by the pointer's x, and the stage rail. */
(() => {
  const { register, pointer, reducedMotion, mk, inject, clamp } = HL, { N, STAGES, DETAIL, S } = PP;
  inject(document);
  const stage = document.getElementById('stage'), svg = mk('svg', { viewBox: '0 0 400 320', 'aria-hidden': 'true' }, stage);
  const M = PP.build(svg), DW = 1100, HOLD = 3800, CYC = (N + 1)*DW + HOLD;
  let t0 = null, man = null, shown = -1, R = null;
  const at = now => {
    if (man !== null) return man;
    if (reducedMotion()) return N;
    if (t0 === null) t0 = now - N*DW;
    return Math.min(N, Math.floor(((now - t0) % CYC)/DW));
  };
  const stageOf = k => STAGES.reduce((s, [, k0], i) => (k >= k0 ? i : s), -1);
  const btns = STAGES.map(([name, k0], i) => {
    const li = document.createElement('li'), b = document.createElement('button'), s = document.createElement('span');
    b.type = 'button'; s.textContent = String(i + 1).padStart(2, '0') + ' ' + name; b.append(s);
    b.addEventListener('click', () => { if (reducedMotion()) man = k0; else { man = null; t0 = performance.now() - k0*DW; } R && R.wake(); });
    li.append(b); document.getElementById('rail').append(li); return b;
  });
  function ui(k){
    if (k === shown) return; shown = k;
    const s = stageOf(k);
    document.getElementById('stageName').textContent = s < 0 ? '00  start' : String(s + 1).padStart(2, '0') + '  ' + STAGES[s][0];
    document.getElementById('read').textContent = DETAIL[k];
    btns.forEach((b, i) => { if (i === s) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); b.classList.toggle('done', i < s); });
  }
  R = register(stage, (dt, now) => { S.now = now; S.k = at(now); ui(S.k); PP.draw(M); return !reducedMotion(); });
  const pick = p => { man = clamp(Math.round((p[0] - 24)/352*N), 0, N); R.wake(); };
  pointer(stage, { move: pick, down: pick, leave: () => { if (man !== null && !reducedMotion()) t0 = performance.now() - man*DW; man = null; R.wake(); } });
})();
</script>
