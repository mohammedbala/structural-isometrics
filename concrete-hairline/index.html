<title>Concrete Beam Sequence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&family=Geist+Mono:wght@400&display=swap">
<style>
/* Layout: a header line, then a grid of 5:4 plates, one looping figure each. Black and white only:
   the hairline palette is set to pure greys, white on black in dark, black on white in light. */
:root{
  color-scheme:light;
  --ground:#ffffff; --ink:#000000; --muted:#6c6c6c; --line:#e4e4e4;
  --hairline-plate:#ffffff; --hairline-hi:#000000; --hairline-edge:#6a6a6a; --hairline-mid:#adadad; --hairline-lo:#dedede; --hairline-stroke:0.9;
  --f-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#000000; --ink:#ffffff; --muted:#8c8c8c; --line:#1e1e1e;
    --hairline-plate:#000000; --hairline-hi:#ffffff; --hairline-edge:#8e8e8e; --hairline-mid:#4c4c4c; --hairline-lo:#262626;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#000000; --ink:#ffffff; --muted:#8c8c8c; --line:#1e1e1e;
  --hairline-plate:#000000; --hairline-hi:#ffffff; --hairline-edge:#8e8e8e; --hairline-mid:#4c4c4c; --hairline-lo:#262626;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:13px/1.5 var(--f-sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding-inline:clamp(16px,3vw,40px);padding-block:44px 64px;display:grid;gap:28px}
.wrap > *{min-width:0}
header{display:grid;gap:10px}
h1{margin:0;font:300 clamp(30px,4vw,46px)/1.04 var(--f-sans);letter-spacing:-.025em;text-wrap:balance}
header p{margin:0;max-width:58ch;color:var(--muted);font-size:14px;text-wrap:pretty}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.tile{position:relative;margin:0;min-width:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--ground)}
.tag{position:absolute;top:12px;z-index:1;font:11px/1 var(--f-mono);letter-spacing:.02em;color:var(--muted);pointer-events:none}
.tag.name{left:14px}
.tag.read{right:14px;color:var(--ink);font-variant-numeric:tabular-nums}
footer{font:11px/1.7 var(--f-mono);color:var(--muted)}
footer a{color:inherit}
</style>
<div class="wrap">
  <header>
    <h1>Concrete beam, built in twelve lines</h1>
    <p>A reinforced concrete beam model, from its dimensions to its first cracks. Each figure loops on its own. Move across one to step through it.</p>
  </header>
  <main class="grid" id="grid"></main>
  <footer>Drawn on the <a href="https://github.com/lucasmarkes/hairline">hairline</a> kernel by Lucas Marques, MIT licence.</footer>
</div>

      const G = 7*v, ox = (b.i - 1)*G, oy = (b.j - 1)*G, oz = (b.q - 1)*G;
      put(b.el, box(P, front, XS[b.i] + ox, YS[b.j] + oy, ZS[b.q] + oz, XS[b.i+1] + ox, YS[b.j+1] + oy, ZS[b.q+1] + oz, 1.6, .7));
    });
    const split = open > .001;
    blocks.forEach(b => { show(b.el.g, split); cls(b.el.sil, k === 4 && b.d === 0 ? 'sil hi' : 'sil'); });
    show(whole.g, !split);
    cuts.forEach(c => {
      const vp = tw(c.tp, k === c.ph, now, c.dl), vs = tw(c.ts, k >= c.ph, now, c.dl + 240);
      setD(c.pl, line(c.plane.map(p => P(...p)), vp));
      setD(c.sm, split ? '' : line(c.seam.map(p => P(...p)), vs));
      cls(c.sm, k === c.ph ? 'nf hi' : 'nf');
    });
  }, ['V 1', 'V 3', 'V 9', 'V 27', 'V 27 open']);
} });

<script>

FIGS.push({ name: 'reinforcement', means: 'Inside the dashed outline of the concrete, the bottom bars run in, then the top bars, then the links drop over them.', mount(ctx){

    links.forEach(l => {

/* 08 · materials */
FIGS.push({ name: 'materials', means: 'Aggregate spreads across the concrete from one corner, then the steel shows at the bar ends.', mount(ctx){
  const { mk, put, solid, place, poly } = HL, { L, B, H, CV, setD, cls, show, T, tw, BOX, line, box } = HB;
  const f = HB.base(ctx, 2.0, [...BOX(0, H), [L + 20, B, 0]], 2), { P, g, front } = f;
  put(solid(g), box(P, front, 0, 0, 0, L, B, H));
  let s = 7; const rnd = () => (s = (s*16807) % 2147483647)/2147483647;
  const dots = [], add = (n, at) => { for (let i = 0; i < n; i++){ const p = at(rnd(), rnd()), big = rnd() < .22;
    dots.push({ p, t: T(), dl: Math.hypot(p[0], B - p[1], H - p[2])/L*900, el: mk('circle', { r: big ? .9 : .55, class: big ? 'dot m' : 'dot off' }, g) }); } };
  add(60, (a, b) => [4 + a*(L - 8), 2 + b*(B - 4), H]);
  add(84, (a, b) => [4 + a*(L - 8), B, 2 + b*(H - 4)]);
  add(10, (a, b) => [L, 2 + a*(B - 4), 2 + b*(H - 4)]);
  dots.forEach(d => place(d.el, P(...d.p)));
  const ring = (x, y, z, r) => poly(Array.from({ length: 12 }, (_, i) => { const a = i/12*Math.PI*2; return P(x, y + r*Math.cos(a), z + r*Math.sin(a)); }));
  const bars = [[CV, CV], [B - CV, CV], [CV, H - CV], [B - CV, H - CV]].map(([y, z], i) => ({ y, z, t: T(), dl: i*90,
    hole: mk('path', { class: 'nf' }, g), el: mk('path', { class: 'nf hi' }, g), tip: mk('path', { class: 'hi' }, g) }));
  return f.run((k, now) => {
    dots.forEach(d => show(d.el, tw(d.t, k >= 1, now, d.dl) > .5));
    bars.forEach(b => {
      const v = tw(b.t, k >= 2, now, b.dl), x = L + 16*v;
      setD(b.hole, v > .001 ? ring(L, b.y, b.z, 1.4) : '');
      setD(b.el, line([P(L, b.y, b.z), P(x, b.y, b.z)]));
      setD(b.tip, v > .001 ? ring(x, b.y, b.z, 1.4) : '');
      cls(b.el, k === 2 ? 'nf hi' : 'nf sil'); cls(b.tip, k === 2 ? 'hi' : 'sil');

/* 09 · mesh */
FIGS.push({ name: 'mesh', means: 'Element lines sweep along the beam, then across it, and the nodes settle on the front face.', mount(ctx){
  const { mk, put, solid, place, poly } = HL, { L, B, H, setD, cls, show, T, tw, BOX, line, box } = HB;
  const f = HB.base(ctx, 2.1, BOX(0, H), 3), { P, g, front } = f;

  [H/4, H/2, 3*H/4].forEach((z, i) => lines.push({ ph: 2, dl: i*70, pts: [[1.8, B, z], [L, B, z], [L, .8, z]] }));
  [B/3, 2*B/3].forEach((y, i) => lines.push({ ph: 2, dl: 210 + i*70, pts: [[1.8, y, H], [L, y, H], [L, y, .8]] }));
  lines.forEach(l => { l.t = T(); l.el = mk('path', { class: 'nf' }, g); l.sp = l.pts.map(p => P(...p)); });
  const cell = mk('path', { class: 'nf hi', d: poly([P(X[6], B, 0), P(X[7], B, 0), P(X[7], B, Z[1]), P(X[6], B, Z[1])]) }, g), tc = T();

  return f.run((k, now) => {

<script>
/* The bench under the beam, shared by 10–12: a plinth, a tapered pin bearing and a roller bearing on pucks. */
HB.bearings = (g, P, front) => {
  const { put, solid, rings, prism, rrect } = HL, { L, B, ZS, box, taper, disc } = HB;
  const [pr, pi] = rings(-16, -9, L + 16, B + 9, 8, 2);
  put(solid(g), prism(P, front, pr, pi, -3, 0));
  const xp = 9, xr = L - 9;
  const pin = solid(g), pucks = [2.6, 9, 15.4].map(y => ({ y, el: solid(g) })), pad = solid(g);
  return (vp, vr) => {
    pin.g.style.display = vp > .01 ? '' : 'none';
    if (vp > .01) put(pin, taper(P, front, rrect(xp - 9, -2, xp + 9, B + 2, 2.4, 4), rrect(xp - 2.6, -2, xp + 2.6, B + 2, 1.2, 4),
      rrect(xp - 1.8, -1.2, xp + 1.8, B + 1.2, .6, 4), 0, ZS*vp));
    const on = vr > .01;
    pucks.forEach(p => { p.el.g.style.display = on ? '' : 'none'; if (on) put(p.el, prism(P, front, disc(xr, p.y, 2.6), disc(xr, p.y, 1.8), 0, 5*vr)); });
    pad.g.style.display = on ? '' : 'none';
    if (on) put(pad, box(P, front, xr - 8, -2, 5*vr, xr + 8, B + 2, 5*vr + (ZS - 5)*vr, 2, .8));
    return { pin, pad };
  };
};
/* Load pads and their weights at the third points; base(x) gives the beam's top at x. */
HB.weights = (g, P, front) => {
  const { put, solid, prism } = HL, { L, B, box, disc } = HB;
  return [L/3, 2*L/3].map(x => ({ x, pad: solid(g), discs: [0, 1, 2, 3].map(n => ({ n, el: solid(g) })) }));
};
HB.drawWeights = (P, front, sets, base, vPad, vDisc) => {
  const { put, prism } = HL, { B, box, disc } = HB;
  sets.forEach(s => {
    const z0 = base(s.x), vp = vPad(s);
    s.pad.g.style.display = vp > .01 ? '' : 'none';
    if (vp > .01) put(s.pad, box(P, front, s.x - 7, -2, z0 + 20*(1 - vp), s.x + 7, B + 2, z0 + 3 + 20*(1 - vp), 2, .8));
    s.discs.forEach(d => {
      const v = vDisc(s, d), z = z0 + 3 + d.n*3.9 + 24*(1 - v);
      d.el.g.style.display = v > .01 ? '' : 'none';
      if (v > .01) put(d.el, prism(P, front, disc(s.x, B/2, 6.5), disc(s.x, B/2, 5.6), z, z + 3.6));
    });
  });
};

/* 10 · supports */
FIGS.push({ name: 'supports', means: 'A pin and a roller rise from the base, and the beam lowers onto them along its drop lines.', mount(ctx){
  const { mk, put, solid } = HL, { L, B, H, ZS, setD, cls, show, T, tw, line, box } = HB;
  const f = HB.base(ctx, 1.85, [[-16,-9,-3],[L+16,B+9,-3],[L+16,-9,0],[-16,B+9,0],[0,0,ZS+H+34],[L,B,ZS+H]], 3), { P, g, front } = f;
  const draw = HB.bearings(g, P, front);
  const drops = [9, L - 9].map(x => ({ x, el: mk('path', { class: 'nf dash' }, g) }));
  const beam = solid(g), tp = T(), tr = T(), tb = T();
  let last = -1;
  return f.run((k, now) => {
    const vp = tw(tp, k >= 1, now), vr = tw(tr, k >= 2, now), vb = tw(tb, k >= 3, now), off = 34*(1 - vb);
    const s = draw(vp, vr);
    cls(s.pin.sil, k === 1 ? 'sil hi' : 'sil'); cls(s.pad.sil, k === 2 ? 'sil hi' : 'sil');
    drops.forEach(d => setD(d.el, off > .3 && k >= 2 ? line([P(d.x, B, ZS), P(d.x, B, ZS + off)]) : ''));
    if (off !== last){ last = off; put(beam, box(P, front, 0, 0, ZS + off, L, B, ZS + H + off)); }
    cls(beam.sil, k === 3 ? 'sil hi' : 'sil');
  }, ['base', 'pin', 'roller', 'seated']);
} });

/* 11 · loads */
FIGS.push({ name: 'loads', means: 'Pads land at the third points, then weights stack on them in two steps.', mount(ctx){
  const { put, solid } = HL, { L, B, H, ZS, cls, T, tw, box } = HB;
  const f = HB.base(ctx, 1.85, [[-16,-9,-3],[L+16,B+9,-3],[L+16,-9,0],[-16,B+9,0],[0,0,ZS+H+44],[L,B,ZS+H+20]], 3), { P, g, front } = f;
  HB.bearings(g, P, front)(1, 1);
  put(solid(g), box(P, front, 0, 0, ZS, L, B, ZS + H));
  const sets = HB.weights(g, P, front);
  sets.forEach(s => { s.t = T(); s.discs.forEach(d => { d.t = T(); }); });
  return f.run((k, now) => {
    HB.drawWeights(P, front, sets, () => ZS + H,
      s => tw(s.t, k >= 1, now),
      (s, d) => tw(d.t, k >= (d.n < 2 ? 2 : 3), now, (d.n & 1)*130));
    sets.forEach(s => { cls(s.pad.sil, k === 1 ? 'sil hi' : 'sil'); s.discs.forEach(d => cls(d.el.sil, k >= 2 && d.n === (k === 2 ? 1 : 3) ? 'sil hi' : 'sil')); });
  }, ['beam', 'pads', 'P 50', 'P 100']);
} });

/* 12 · cracking */
FIGS.push({ name: 'cracking', means: 'The loaded beam bends in steps, and cracks open up from its soffit, first under the load, then out towards the supports.', mount(ctx){
  const { mk, poly, open, clamp, tween, tset, tval } = HL, { L, B, H, ZS, setD, cls, bend } = HB;
  const f = HB.base(ctx, 1.85, [[-16,-9,-3],[L+16,B+9,-3],[L+16,-9,0],[-16,B+9,0],[0,0,ZS+H+20],[L,B,ZS+H]], 4, { dwell: 1250 }), { P, g, front } = f;
  HB.bearings(g, P, front)(1, 1);
  const sil = mk('path', { class: 'sil' }, g), crease = mk('path', { class: 'nf' }, g);
  const CR = [];
  [-24, -16, -8, 0, 8, 16, 24].forEach(o => CR.push({ x: L/2 + o, on: .26 + Math.abs(o)/24*.14, h: .74 - Math.abs(o)/24*.18, lean: 0 }));
  [[L/3 - 13, .5, .6], [L/3 - 27, .68, .5], [2*L/3 + 13, .5, -.6], [2*L/3 + 27, .68, -.5]].forEach(([x, on, lean]) => CR.push({ x, on, h: .55, lean }));
  CR.forEach((c, i) => { c.el = mk('path', { class: 'nf hi' }, g); c.j = i % 2 ? 1 : -1; });
  const sets = HB.weights(g, P, front), lam = tween(1, 900), N = 32, D = 9;
  let drawn = -1;
  return f.run((k, now) => {
    tset(lam, k/4, now); const l = tval(lam, now);
    if (l === drawn) return; drawn = l;
    const d = x => -D*l*bend(x), xs = Array.from({ length: N + 1 }, (_, i) => i*L/N);
    setD(sil, poly([...xs.map(x => P(x, 0, ZS + H + d(x))), P(L, 0, ZS), P(L, B, ZS), ...xs.slice().reverse().map(x => P(x, B, ZS + d(x))), P(0, B, ZS + H)]));
    setD(crease, open([...xs.slice(1, -1).map(x => P(x, B - 1, ZS + H + d(x))), P(L - 1, B - 1, ZS + H), P(L - 1, 1, ZS + H)]));
    CR.forEach(c => {
      const gr = clamp((l - c.on)/(1 - c.on)*1.7, 0, 1), h = c.h*H*gr;
      setD(c.el, gr > .01 ? open([0, 1, 2, 3, 4].map(i => { const x = c.x + c.lean*h*i/4 + (i % 2 ? c.j*1.1 : 0); return P(x, B, ZS + d(x) + h*i/4); })) : '');
    });
    HB.drawWeights(P, front, sets, x => ZS + H + d(x), () => 1, () => 1);
  }, ['P 0', 'P 25', 'P 50', 'P 75', 'P 100']);
} });

/* Mount every figure in its own plate. */
(() => {
  HL.inject(document);
  const grid = document.getElementById('grid');
  FIGS.forEach((fg, i) => {
    const tile = document.createElement('figure'), name = document.createElement('span'), out = document.createElement('span'), host = document.createElement('div');
    tile.className = 'tile'; name.className = 'tag name'; out.className = 'tag read';
    name.textContent = String(i + 1).padStart(2, '0') + '  ' + fg.name;
    host.setAttribute('data-hairline', fg.name); host.setAttribute('role', 'img'); host.setAttribute('aria-label', fg.means);
    tile.append(name, out, host); grid.append(tile);
    const svg = HL.mk('svg', { viewBox: '0 0 400 320', 'aria-hidden': 'true' }, host);
    let text = '';
    const read = { get textContent(){ return text; }, set textContent(v){ text = v == null ? '' : String(v); out.textContent = text; } };
    try { fg.mount({ stage: host, svg, read }); } catch (e) { console.error(fg.name, e); }
  });
})();
